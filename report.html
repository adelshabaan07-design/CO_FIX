<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CO-FIX — Report a Problem 🚨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue: #2563eb;
            --cyan: #38bdf8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --soft: #eff6ff;
            --shadow: 0 10px 30px rgba(15,23,42,0.08);
            --card-bg: #ffffff;
        }

        body.dark {
            --bg: #0b1329;
            --surface: #111e38;
            --text: #f8fafc;
            --muted: #94a3b8;
            --line: #1e2d4a;
            --soft: #1e3a8a4d;
            --shadow: 0 15px 40px rgba(0,0,0,.5);
            --card-bg: #152442;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            line-height: 1.6;
            padding-top: 100px;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* RGB TOP ANIMATED BAR */
        .rgb-top-bar {
            height: 4px; width: 100%; position: fixed; top: 0; left: 0; z-index: 100000;
            background: linear-gradient(90deg, #ff007f, #7928ca, #00dfd8, #0070f3, #ff007f);
            background-size: 300% 100%;
            animation: rgbGradient 4s linear infinite;
        }
        @keyframes rgbGradient {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        /* NAVBAR (ثابتة في أعلى الصفحة) */
        .navbar {
            position: fixed !important;
            top: 4px !important;
            left: 0 !important;
            right: 0 !important;
            height: 72px !important;
            z-index: 99999 !important;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 5%;
            background: rgba(255, 255, 255, 0.95); 
            border-bottom: 1px solid var(--line); 
            backdrop-filter: blur(15px);
        }
        body.dark .navbar { background: rgba(11, 19, 41, 0.95); }
        
        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; position: relative; }
        .logo img { height: 38px; object-fit: contain; }

        .rgb-logo-accent {
            position: absolute; bottom: -6px; left: 0;
            width: 100px; height: 3px;
            background: linear-gradient(90deg, #ff007f, #38bdf8, #2563eb);
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        .nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
        .nav-links a, .nav-btn {
            text-decoration: none; color: var(--text); padding: 7px 12px; border-radius: 20px; font-size: 13.5px; font-weight: 600;
            background: transparent; border: 1px solid transparent; cursor: pointer; transition: .2s;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-btn:hover { background: var(--soft); border-color: var(--line); color: var(--cyan); }
        
        .bell-badge { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .notif-count {
            background: #ef4444; color: white; font-size: 10px; font-weight: 800; border-radius: 50%;
            padding: 2px 6px; margin-left: 3px;
        }

        /* MENU TOGGLE BUTTON (☰) FOR MOBILE */
        .menu-toggle-btn {
            display: none;
            background: var(--soft);
            border: 1px solid var(--line);
            color: var(--text);
            font-size: 20px;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .menu-toggle-btn:hover { background: var(--line); color: var(--cyan); }

        /* FORM CARD */
        .report-card {
            max-width: 680px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #1e40af, #0284c7);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .form-header h1 {
            font-size: clamp(22px, 3.5vw, 28px);
            font-weight: 900;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-body {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text);
        }

        .input-group input[type="text"],
        .input-group input[type="url"],
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            transition: 0.2s;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .input-group textarea {
            resize: vertical;
            height: 110px;
        }

        .file-zone {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg);
            padding: 12px;
            border: 1px dashed var(--line);
            border-radius: 12px;
        }

        .custom-file-btn {
            background: var(--blue);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.2s;
        }

        .custom-file-btn:hover { background: #1d4ed8; }

        #file-name { font-size: 13px; color: var(--muted); }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #0284c7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37,99,235,0.25);
            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37,99,235,0.35);
        }

        .toast-message {
            display: none;
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #10b981;
            color: white;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(16,185,129,0.3);
            z-index: 1000;
        }

        .required-star { color: #ef4444; }

        /* RESPONSIVE MOBILE BREAKPOINTS */
        @media(max-width: 900px) {
            .menu-toggle-btn { display: flex; }

            .nav-links {
                position: fixed;
                top: 76px;
                right: -100%;
                width: 280px;
                height: calc(100vh - 76px);
                background: var(--card-bg);
                border-left: 1px solid var(--line);
                flex-direction: column;
                align-items: stretch;
                padding: 25px 20px;
                gap: 12px;
                box-shadow: var(--shadow);
                transition: right 0.3s ease-in-out;
                z-index: 99;
                overflow-y: auto;
            }

            html[dir="rtl"] .nav-links {
                right: auto;
                left: -100%;
                border-left: none;
                border-right: 1px solid var(--line);
                transition: left 0.3s ease-in-out;
            }

            .nav-links.active { right: 0; }
            html[dir="rtl"] .nav-links.active { left: 0; }

            .nav-links a, .nav-btn {
                width: 100%;
                text-align: center;
                padding: 12px;
                font-size: 15px;
                border: 1px solid var(--line);
                border-radius: 12px;
            }

            .form-body { padding: 20px; }
        }
    </style>
</head>

<body>

<!-- RGB TOP ANIMATED BAR -->
<div class="rgb-top-bar"></div>

<!-- NAVBAR (الناف بار الثابتة الموحدة) -->
<div class="navbar">
  <a href="index.html" class="logo">
    <img src="images/co-fix-logo.png" alt="Co-Fix Logo">
    <div class="rgb-logo-accent"></div>
  </a>

  <button class="menu-toggle-btn" id="menuToggleBtn" title="Toggle Navigation">
    <i class="fa-solid fa-bars"></i>
  </button>

  <ul class="nav-links" id="navMenu">
    <li><a href="index.html" data-key="navHome">Home</a></li>
    <li><a href="index.html#steps" data-key="navSteps">Steps</a></li>
    <li><a href="index.html#projects" data-key="navWork">Our Work</a></li>
    <li><a href="report.html" data-key="navReport">Report Problem</a></li>
    <li><a href="voulnteer.html" data-key="navVolunteer">Volunteer</a></li>
    <li><a href="about.html" data-key="navAbout">About Us 👤</a></li>
    <li class="bell-badge">
      <a href="problem.html" title="Notifications">🔔 <span data-key="navNotif">Notifications</span> <span id="notif" class="notif-count">0</span></a>
    </li>
    <li><button class="nav-btn" id="langToggle">العربية</button></li>
    <li><button class="nav-btn" id="themeToggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i> Theme</button></li>
  </ul>
</div>

<!-- REPORT FORM CARD -->
<div class="report-card">
    <div class="form-header">
        <h1 data-key="headerTitle">Report a Problem 🚨</h1>
        <p data-key="headerSub">Help us improve our services by reporting any issue or problem you face</p>
    </div>
    <div class="form-body">
        <form id="reportForm" novalidate>

            <div class="input-group">
                <label><i class="fa-solid fa-user"></i> <span data-key="lblFullName">Full Name</span> <span class="required-star">*</span></label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-image"></i> <span data-key="lblImage">Problem Image</span></label>
                <div class="file-zone">
                    <label for="problemImage" class="custom-file-btn">📁 Choose File</label>
                    <span id="file-name">No file selected</span>
                    <input type="file" id="problemImage" accept="image/*" style="display:none;">
                </div>
                <small style="color:var(--muted); font-size:12px;">jpg, png, webp (optional)</small>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-location-dot"></i> <span data-key="lblArea">Area / Neighborhood</span> <span class="required-star">*</span></label>
                <input type="text" id="region" placeholder="Example: Al Worood, Alexandria..." required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-triangle-exclamation"></i> <span data-key="lblType">Problem Type</span> <span class="required-star">*</span></label>
                <select id="problemType" required>
                    <option value="" disabled selected>-- Select Problem Type --</option>
                    <option value="Infrastructure">Infrastructure (roads, lighting)</option>
                    <option value="Cleanliness">Public cleanliness / waste bins</option>
                    <option value="Electricity">Electricity / faulty lighting</option>
                    <option value="Water">Water / sewage</option>
                    <option value="Landscaping">Landscaping / parks</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="input-group" id="otherFieldGroup" style="display: none;">
                <label><i class="fa-solid fa-pen-to-square"></i> <span data-key="lblOther">Other Details</span></label>
                <input type="text" id="otherReason" placeholder="Write the other problem type...">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-clipboard-list"></i> <span data-key="lblDetails">Problem Details</span> <span class="required-star">*</span></label>
                <textarea id="problemDetails" placeholder="Describe the problem in detail..." required></textarea>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-map-location-dot"></i> <span data-key="lblMap">Map Location Link (Google Maps)</span></label>
                <input type="url" id="mapLink" placeholder="https://maps.app.goo.gl/...">
            </div>

            <hr style="border:0; border-top:1px solid var(--line); margin:20px 0;">
            
            <button type="submit" class="submit-btn" id="submitProblemBtn">
                <span>📢</span> <span data-key="btnSubmit">Submit Report</span>
            </button>
        </form>
    </div>
</div>

<div id="toastMsg" class="toast-message">
    ✅ Your report has been received successfully, thank you!
</div>

<script src="report.js"></script>

<script>
// Mobile Drawer Menu Toggle
const menuToggleBtn = document.getElementById('menuToggleBtn');
const navMenu = document.getElementById('navMenu');

menuToggleBtn.onclick = () => {
  navMenu.classList.toggle('active');
  const isOpen = navMenu.classList.contains('active');
  menuToggleBtn.innerHTML = isOpen ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-bars"></i>';
};

document.querySelectorAll('#navMenu a').forEach(link => {
  link.onclick = () => {
    navMenu.classList.remove('active');
    menuToggleBtn.innerHTML = '<i class="fa-solid fa-bars"></i>';
  };
});

// Notifications count
let problems = JSON.parse(localStorage.getItem("problems")) || [];
document.getElementById("notif").textContent = problems.length;

const translations = {
  en: {
    navHome: "Home", navSteps: "Steps", navWork: "Our Work", navReport: "Report Problem", navVolunteer: "Volunteer", navAbout: "About Us 👤", navNotif: "Notifications",
    headerTitle: "Report a Problem 🚨",
    headerSub: "Help us improve our services by reporting any issue or problem you face",
    lblFullName: "Full Name", lblImage: "Problem Image", lblArea: "Area / Neighborhood", lblType: "Problem Type",
    lblOther: "Other Details", lblDetails: "Problem Details", lblMap: "Map Location Link (Google Maps)", btnSubmit: "Submit Report"
  },
  ar: {
    navHome: "الرئيسية", navSteps: "الخطوات", navWork: "أعمالنا", navReport: "إبلاغ عن مشكلة", navVolunteer: "تطوع معنا", navAbout: "عن المنصة 👤", navNotif: "الإشعارات",
    headerTitle: "الإبلاغ عن مشكلة 🚨",
    headerSub: "ساعدنا في تحسين وتطوير منطقتك عبر تقديم بلاغ عن أي مشكلة تواجهك",
    lblFullName: "الاسم الكامل", lblImage: "صورة المشكلة", lblArea: "المنطقة / الحي", lblType: "نوع المشكلة",
    lblOther: "تفاصيل أخرى", lblDetails: "تفاصيل المشكلة", lblMap: "رابط الموقع (خرائط جوجل)", btnSubmit: "إرسال البلاغ"
  }
};

let currentLang = localStorage.getItem('cofix-lang') || 'en';

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('cofix-lang', lang);
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('langToggle').textContent = lang === 'en' ? 'العربية' : 'English';

  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.getAttribute('data-key');
    if (translations[lang][key]) {
      el.innerHTML = translations[lang][key];
    }
  });
}

document.getElementById('langToggle').onclick = () => {
  setLanguage(currentLang === 'en' ? 'ar' : 'en');
};

setLanguage(currentLang);

const themeToggle = document.getElementById('themeToggle');
if(localStorage.getItem("cofix-theme")==="dark"){
  document.body.classList.add("dark");
  themeToggle.innerHTML='<i class="fa-solid fa-sun"></i> Theme';
}
themeToggle.onclick=()=>{
  document.body.classList.toggle("dark");
  const dark=document.body.classList.contains("dark");
  themeToggle.innerHTML= dark ? '<i class="fa-solid fa-sun"></i> Theme' : '<i class="fa-solid fa-moon"></i> Theme';
  localStorage.setItem("cofix-theme", dark?"dark":"light");
};
</script>

</body>
</html>
